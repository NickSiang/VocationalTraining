<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .all {
            width: 100%;
            height: 100vh;
            background: #00000065;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img {
            max-width: 400px;
            display: none;
        }

        .container {
            max-width: min-content;
            background-color: rgb(255, 255, 255);
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        h2 {
            width: max-content;
        }

        .btn-block {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            color: white;
            background: #000;
            padding: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            border: transparent;
        }

        .nobtn:hover {
            background: green;
        }

        .yesbtn:hover {
            background: red;
        }

        .btn:active {
            transform: scale(0.94);
        }
    </style>
</head>

<body>
    <div class="all">
        <div class="container">
            <h2>警告︰您即將進入之網頁內容需滿十八歲方可瀏覽。</h2>
            <p>根據「兒童及少年福利與權益保障法」規定，本網站已於非闔家皆宜之網頁加以標示。若您尚未年滿十八歲，請點選離開。若您已滿十八歲，亦不可將本站之內容派發、傳閱、出售、出租、交給或借予年齡未滿18歲的人士瀏覽，或將本網站內容向該人士出示、播放或放映。
                您年滿十八歲嗎？</p>
            <div class="btn-block">
                <button type="button" class="btn nobtn"
                    onclick="window.location.href='https://www.google.com/webhp?hl=zh-TW&sa=X&ved=0ahUKEwjctPPMk9-LAxXoiq8BHdDVDM4QPAgI'">離開</button>
                <button type="button" class="btn yesbtn">是，我已年滿十八歲</button>
            </div>
        </div>
        <img class="example"
            src="https://plus.unsplash.com/premium_photo-1667030474693-6d0632f97029?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="">
    </div>


    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>

    <script>

        let state;

        const container = document.querySelector('.container');
        const background = document.querySelector('.all');
        const example = document.querySelector('.example');
        const btn = document.querySelector('.yesbtn');

        btn.addEventListener('click', () => {
            Cookies.set('state', `${state}`, { expires: 1 })
            container.style.display = 'none';
            background.style.background = 'none';
            example.style.display = 'flex';
        });

        if (Cookies.get('state')) {
            container.style.display = 'none';
            background.style.background = 'none';
            example.style.display = 'flex';
        }

    </script>
</body>

</html>
