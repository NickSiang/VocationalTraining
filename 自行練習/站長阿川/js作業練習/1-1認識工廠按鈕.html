<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .all {
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        .all button {
            padding: 10px 20px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            background-color: #5280ff;

            box-shadow: 5px 5px 0px black;
            border-radius: 5px;
            border: 2px solid black;

          transition: all 0.3s ease;
            cursor: pointer;

        }

        .all button:hover {
            background-color: #fff;
            color: #5280ff;
            border: 2px solid #5280ff;
            box-shadow: 5px 5px 0px #5280ff;
        }

        .all button:active {
            background-color: #fff;
            color: #5280ff;
            border: 2px solid #5280ff;
            box-shadow: 0px 0px 0px #5280ff;
            transform: translateY(4px);
        }

    </style>
</head>

<body>

    <div class="all">
        <button type="button" onclick="clickBtn1()">我要訂購</button>
        <button type="button" onclick="clickBtn2()">認識工廠</button>
    </div>

    <script>
        function clickBtn1() {
            alert('謝謝您對我們的衣服有興趣！請致電 0987-654-321，會有專人提供您報價！');
        }
        function clickBtn2() {
            alert('我們工廠位於新北市，通過國際 ISO9001 認證，品質讓您放心！');
        }
    </script>
</body>

</html>
