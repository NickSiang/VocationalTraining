<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            width: 100%;
            height: 100vh;
            margin-bottom: 20px;
        }

        img.lazy {
            opacity: 0;
        }

        img:not(.initial) {
            transition: opacity 5s;
        }

        img.initial,
        img.loaded,
        img.error {
            opacity: 1;
        }

        img:not([src]) {
            visibility: hidden;
        }

    </style>
</head>
