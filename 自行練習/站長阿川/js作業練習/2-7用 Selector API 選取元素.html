<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            display: flex;
            justify-content: center;

        }

        main {
            color: black;
            font-size: 18px;
            font-weight: 600;
            margin: 50px 0;
            display: flex;
            gap: 12px;
            flex-direction: column;
            border-radius: 8px;
            background-image: linear-gradient(160deg, #0093E9 0%, #7ac1ff 100%);
        }


        .m-y {
            margin: 0 40px;
        }

        .topblock {
            background: #4f4f4f85;
            padding: 10px 10px 10px 40px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topblock p {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 800;
            font-size: 24px;
            padding: 0;
            margin: 0;
        }

        .topblock #alert {
            background: transparent;
            border: transparent;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 4px;
        }

        .topblock #alert:hover {
            opacity: 0.8;
        }

        .midblock {
            display: flex;

            justify-content: space-between;
            padding: 18px 0;
        }

        .midblock input {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            height: 42px;
            border: transparent;
            padding: 0 10px;
            background: transparent;
            border: 2px solid rgb(255, 255, 255);
            border-right: transparent;
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            outline: none;
        }

        input.borderRed {
            border: 2px solid rgb(255, 62, 62);
            border-right: transparent;
        }

        input.borderOrange {
            border: 2px solid rgb(255, 188, 64);
            border-right: transparent;
        }

        input.borderGreen {
            border: 2px solid rgb(43, 237, 43);
            border-right: transparent;
        }

        .midblock input:focus,
        .midblock select:focus {
            color: black;
            background: white;

        }

        .midblock select {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            background: transparent;
            border: white 2px solid;
            margin-right: 12px;
            padding: 8px;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            outline: none;
        }

        .midblock select option {
            font-weight: 600;
        }

        select.borderRed {
            border: 2px solid rgb(255, 62, 62);
        }

        select.borderOrange {
            border: 2px solid rgb(255, 188, 64);

        }

        select.borderGreen {
            border: 2px solid rgb(43, 237, 43);

        }

        .midblock #add {
            width: 42px;
            height: 100%;
            font-size: 24px;
            color: white;
            background: transparent;
            border: white 2px solid;
            border-radius: 16px;
            cursor: pointer;
        }

        .midblock #add:hover {
            background: #F5F5F5;
            color: #29a5f2;
        }

        .bottomblock #note {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0;
            margin: 0 0 40px;
        }

        #note li {
            list-style: none;
            padding: 10px 10px 10px 20px;
            border-bottom-right-radius: 12px;
            border-top-right-radius: 12px;
            border-bottom-left-radius: 4px;
            border-top-left-radius: 4px;
            background: rgba(98, 98, 98, 0.132);
            backdrop-filter: blur(3px);
            color: white;
            border: 1px solid rgba(162, 162, 162, 0.233);
            display: flex;
            gap: 18px;
            flex-direction: column;
            align-items: start;
            justify-content: space-between;
        }

        #note .borderRed {
            border-left: 6px solid rgb(255, 62, 62);
        }

        #note .borderOrange {
            border-left: 6px solid rgb(255, 188, 64);
        }

        #note .borderGreen {
            border-left: 6px solid rgb(43, 237, 43);
        }


        #note li button {
            border: transparent;
            background: transparent;
            color: white;
            cursor: pointer;
        }

        #note li button:hover {
            opacity: 0.7;
        }

        #note li .btnblock {
            width: 100%;
            display: flex;
            justify-content: end;
        }
        
        #note li div{
            height: 24px;
            display: flex;
            align-items: center;
        }

        .undone {
            display: none;
        }

    </style>
</head>

<body>
    <main>
        <section class="topblock">
            <p>待辦事項</p>
            <button type="button" id="alert">
                <svg stroke-linejoin="round" stroke-linecap="round" stroke-width="2.2" stroke="#ffffff" fill="none"
                    viewBox="0 0 24 24" height="24" width="24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"></path>
                    <path d="M15 3v6h6"></path>
                </svg>
            </button>
        </section>
        <section class="midblock m-y">
            <div>
                <input type="text" id="textInput">
            </div>

            <select name="" id="borderColor">
                <option value="" disabled hidden selected>層級</option>
                <option value="borderGreen">一般</option>
                <option value="borderOrange">重要</option>
                <option value="borderRed">緊急</option>
            </select>

            <button type="button" id="add">+</button>
        </section>
        <section class="bottomblock m-y">
            <ul id="note">
                <li class="borderRed">
                    <div>
                        <span>倒垃圾</span>
                        <span class="undone">（已完成）</span>
                    </div>

                    <div class="btnblock">
                        <button type="button" class="doneBtn">[標示為已完成]</button>
                        <button type="button" class="deleteBtn">[刪除]</button>
                    </div>
                </li>
                <li class="borderOrange">
                    <div>
                        <span>繳電話費</span>
                        <span class="undone">（已完成）</span>
                    </div>
                    <div class="btnblock">
                        <button type="button" class="doneBtn">[標示為已完成]</button>
                        <button type="button" class="deleteBtn">[刪除]</button>
                    </div>
                </li>
                <li class="borderGreen">
                    <div>
                        <span>採買本週食材</span>
                        <span class="undone">（已完成）</span>
                    </div>
                    <div class="btnblock">
                        <button type="button" class="doneBtn">[標示為已完成]</button>
                        <button type="button" class="deleteBtn">[刪除]</button>
                    </div>
                </li>
            </ul>
        </section>
    </main>

    <script>
        document.querySelector('#add').addEventListener('click', addList);
        document.querySelector('#alert').addEventListener('click', listAlert);
        document.querySelector('#borderColor').addEventListener('change', ColorChange);
        document.querySelectorAll('.deleteBtn').forEach(function (btn) {
            btn.addEventListener('click', remove);
        });
        document.querySelectorAll('.doneBtn').forEach(function (btn) {
            btn.addEventListener('click', done);
        });

        function addList() {
            const note = document.querySelector('#note');
            const textInput = document.querySelector('#textInput');
            const borderColor = document.querySelector('#borderColor');

            const deleteBtn = document.createElement('button');
            const doneBtn = document.createElement('button');
            const list = document.createElement('li');
            const lisrDiv = document.createElement('div');
            const listText = document.createElement('span');
            const listText1 = document.createElement('span');
            const listBtnBlock = document.createElement('div');


            if (textInput.value.trim() == '') {
                alert('請輸入代辦事項');
                return;
            }

            if (borderColor.value == '') {
                alert('請選取層級');
                return;
            } else {
                list.classList.add(`${borderColor.value}`)
            }

            listText.textContent = textInput.value;
            listText1.textContent = '（已完成）';
            listText1.classList.add('undone')
            listBtnBlock.classList.add('btnblock');

            deleteBtn.textContent = '[刪除]';
            deleteBtn.classList.add('deleteBtn');
            deleteBtn.onclick = remove;

            doneBtn.textContent = '[標示為已完成]';
            doneBtn.classList.add('doneBtn');
            doneBtn.onclick = done;

            note.append(list);
            list.append(lisrDiv, listBtnBlock);
            lisrDiv.append(listText,listText1);
            listBtnBlock.append(doneBtn, deleteBtn);

            textInput.value = '';
            borderColor.value = '';
            textInput.className = '';
            borderColor.className = '';
        };


        function listAlert() {
            const noteAll = document.querySelectorAll('#note li');
            let text = '';
            let num = 0;
            
            for (let i of noteAll) {
                num = num + 1;
                if (i.classList.contains('borderRed')) {
                    text += `${num}.**${i.querySelector('span').textContent}**\n`;
                } else if (i.classList.contains('borderOrange')) {
                    text += `${num}.*${i.querySelector('span').textContent}*\n`;
                }
                else {
                    text += `${num}.${i.querySelector('span').textContent}\n`;
                }
            }
            alert('今日待辦：\n' + text)
        
        };


        function ColorChange() {
            const textInput = document.querySelector('#textInput');
            const borderColor = document.querySelector('#borderColor');

            textInput.className = '';
            borderColor.className = '';
            textInput.classList.add(`${borderColor.value}`);
            borderColor.classList.add(`${borderColor.value}`)
        };

        function remove(event) {
            event.target.closest('li').remove();
        };

        function done(event) {
            let btn = event.target;
            console.log(btn.closest('li'));

            let finishAll = btn.closest('li').querySelector('div');
            let finishBotttom =finishAll.querySelector('span');
            let finishText = finishAll.querySelector('span+span');

            if (btn.dataset.done === 'true') {
                btn.dataset.done = 'false';
                btn.textContent = '[標示為已完成]';
                finishText.classList.add('undone');
                finishBotttom.style.textDecoration = 'none';
            } else {
                btn.dataset.done = 'true';
                btn.textContent = '[標示為未完成]';
                finishText.classList.remove('undone');
                finishBotttom.style.textDecoration = 'line-through';
                finishBotttom.style.textDecorationThickness = '2px';
            }
        };

    </script>
</body>

</html>
