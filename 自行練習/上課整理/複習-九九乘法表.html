<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="t99"></div>

    <script>
        // += 是程式設計中的一種複合賦值運算符，它的作用是將一個變數的值與另一個值相加，
        // 並將結果儲存在該變數中。簡單來說，這是一個縮寫
        // x += y; 這等同於： x = x + y;

        let t99 = document.querySelector('.t99');

        t99.innerHTML = `九九乘法表<br/>`

        for (let i = 1; i < 10; i++) {

            for (let j = 1; j < 10; j++) {

                if (i * j < 10) {
                    t99.innerHTML += `${i} * ${j} = ${i * j}; &nbsp &nbsp &nbsp &nbsp`;
                }
                else{
                    t99.innerHTML += `${i} * ${j} = ${i * j}; &nbsp &nbsp &nbsp`;
                }


            }
            t99.innerHTML += `<br/>`
        }


    </script>

</body>

</html>
