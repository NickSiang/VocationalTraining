<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    button {
        width: 50px;
    }
</style>

<body>
    <div class="demo"></div>
    <button type="button" class="pause">暫停</button>
    <button type="button" class="start">繼續</button>

    <script>
        let pause = document.querySelector('.pause');
        let start = document.querySelector('.start');
        let demo = document.querySelector('.demo');

        let counter = 5;
        let myInterval = setInterval(showCounter, 1000);
        demo.textContent = `${counter}`;

        pause.addEventListener('click', () => {
            clearInterval(myInterval);
        })


        start.addEventListener('click', () => {
            let myInterval = setInterval(showCounter, 1000);
        })



        function showCounter() {
            if (counter > 0) {
                counter--;
            }
            demo.textContent = `${counter}`;
        }


    </script>
</body>

</html>
