<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block {
            background: black;
            width: 100px;
            height: 100px;
            border-radius: 10%;
            margin-bottom: 20px;
            display: grid;
            place-items: center;
        }

        .black {
            cursor: pointer;
        }

        .red {
            background: red;
        }

        .block span {
            color: white;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div class="block black">
        <span>click</span>
    </div>
    <div class="block red"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>

        gsap.to(".red", {
            x: "+=100"
        });

        const control = gsap.to(".black", {
            paused: true,
            x: "+=100",
            y: "+=500"
        });

        document.querySelector(".black").addEventListener("click", function () {
            control.reverse();
        });
        // var control = gsap.to(...)
        // control.play(0); // 從 0 秒播放，沒有輸入數字則當下播放
        // control.pause(0); // 到 0 秒且暫，沒有輸入數字則當下暫停
        // control.restart() // 從新播放
        // control.reverse() // 反方向播放，同play
    </script>
</body>

</html>
