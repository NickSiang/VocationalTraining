<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // ===========================================
        // 函式可接收一個值,把這個數值做運算並回傳
        // 也可以選擇不接收 不回傳任何值
        // 函式可想像一個自訂隨傳即用的工具組合包
        // 函式的宣告 有名稱才可以知道要呼叫哪個變數
        // 沒命名的稱之逆名函式
        // 函數回傳結果透過return來決定回傳內容是甚麼
        // return不一定要存在於函式的內容中 
        // 不過在函式中沒任何return被使用或有return但後面沒值
        // 會回傳undefined(為預設)

        function 函數名稱(函式即將接收的參數放置這邊) {
            大括號標示此函數的範圍
            return; (回傳)
        }

        // 呼叫函式 函式名稱加()稱之呼叫
        // ()不能亂加 在不是函數型別的變數加上()呼叫會導致錯誤
        // let thisIsNumber = 10;
        // thisIsNumber();
        // 函式結束 return後的數值都不會回傳

        // ===========================================
        // 運算子 一元運算子的[元]表示該運算子必須跟幾個放在一起
        // 才能做運算
        // = 的作用為將右邊的值指派給左邊的變數

        // ===========================================
        // + 運算子 常觸發強制轉型的情境
        // 1.數值型別與字串相加(強轉字串)
        let num1 = 1 + '5';
        console.log(num1);
        console.log(typeof num1);
        // 2.數值型別與undefined相加(強轉數值型別)
        // undefined無法轉成數值 因此得到NaN
        // NaN跟任何數值型別運算得到也是 NaN
        let num2 = 2 + undefined;
        console.log(num2);
        console.log(typeof num2);
        // 3.數值型別與物件相加(強轉字串)
        let num3 = 3 + {};
        console.log(num3);
        console.log(typeof num3);

        // ===========================================
        // - 運算子 常觸發強制轉型的情境
        let num4 = 1 - '5';
        console.log(num4);
        console.log(typeof num4);

        // ===========================================
        // / 運算子 常觸發的情境
        // 1.infinity表示無限大結果(超出js能表示的數值範圍)
        let num5 = 10 / 0;
        console.log(num5);
        console.log(typeof num5);

        // ===========================================
        // *運算子 常觸發的情境

        // 1.運算結果超出js能表示的數值範圍
        let num6 = Math.pow(10, 10000)
        console.log(num6);
        // ===========================================
        // Math為js提供一個特殊的預設物件 
        // 包含許多可用來做數學計算的函式
        // 此物件可在任何地方使用 稱全域物件
        // pow為次方運算函式(10,2)為10的2次方
        let num7 = Math.pow(10, 2)
        console.log(num7);

        // ===========================================
        // js 最大數值 (Number也為全域物件)
        console.log(Number.MAX_VALUE);

        // ===========================================
        // %運算子 餘數運算子

        // ===========================================
        // ==和 === 相等運算子
        // 一般比較的用法==
        // 嚴謹的用法===
        // 比較運算子運算完後會得出布林值 常用if函式

        // ===========================================
        // == 一般相等運算子
        // 此運算子不限定運算子兩邊的數值型別
        // 當處理兩邊數值不同型別的情況 會執行一連串的強制轉型
        // 目的是能讓兩邊的的數值能以相同的行別去做比較
        console.log('');
        console.log(false == "");
        console.log(undefined == null);
        console.log('' == '0');
        console.log(false == []);
        console.log(false == ![]);

        // ===========================================
        // === 嚴格的相等運算子 [全等於]
        // 會直接比較型別 若相同則在比較是否為同數值
        console.log('');
        console.log(false === "");
        console.log(undefined === null);
        console.log(0 === '0');

        // ===========================================
        // 物件與語嚴格相等的運算子
        // 字串 數值 布林值 undefined null 都能被概括為純值
        // 當物件被創造之後賦值給變數時,變數儲存內容不是整個物件內容
        // 而是該物件存放記憶體的位置,而不是整個物件的數值內容
        console.log('');
        // 存放記憶體的位置不同 顯示false
        console.log({} === {});
        console.log([] === []);
        // 存放記憶體的位置相同 顯示true
        let a = {};
        let b = a;
        console.log(a === b);

        // ===========================================
        // != , !== 反向相等的運算子 
        // != 和 !== 都是不相等運算子，用來比較兩個值是否不相等
        // != (寬鬆不相等)檢查兩個值是否不相等，忽略資料型別
        // !== (嚴格不相等)檢查兩個值是否不相等，不忽略資料型別。

        // ===========================================
        // > < >= <= 運算子 運算子兩側 需考慮是否為同型別
        // 1.兩側若不是純值 竟可能轉為數值型別
        // 2.兩側皆為字串 按字串內字元的編碼值進型比較
        // 3.一側字串 一串字元,字串嘗試轉為數值型別
        // 4.布林值 null undefined 轉為數值型別
        // false轉為0 true轉為1 null轉為0
        // 5.undefined轉型後會得到NaN NaN與任何數值比較會得到false
        console.log('');
        console.log(undefined > 12);
        console.log(null > 12);
        console.log(true > 0);
        // ===========================================
        // && and(且)運算子
        // 只要左邊數值為false或是可以轉型成false會直接回傳這個數值
        // 兩側true才會得到true結果

        // ===========================================
        // || or(或)運算子 左值先判斷
        // 只要左邊數值為true或是可以轉型成true會直接回傳這個數值

        // ===========================================
        // ! not的運算子 為一元運算子
        // 當not運算子右邊數值可以轉型為true則回傳false

        // ===========================================
        // 右相依性
        let A = 1;
        let B = 2;
        let C = 3;
        // C指派給B之後回傳C為結果
        A = B = C
        // ===========================================
        // 優先序 當一組運算是裡的運算子有相同優先序 才依相依性計算
        console.log(1 + 2 * 3);
        console.log((1 + 2) * 3);

        // ===========================================
        // 明確的轉型 Strung() Number() Boolean()
        // 隱含的轉型 系統自動幫轉型

        // 強制轉型三種類型 1.字串 2.數值 3.布林值

        // 1.字串
        // 明確
        console.log(typeof String(123));
        // 不明確
        console.log(typeof (123 + ''));
        // 2.數值
        // 明確
        console.log(typeof Number('你好'));
        // 不明確
        console.log(typeof (+'你好'));
        // 3.布林值
        // 明確
        console.log(typeof Boolean('你好'));
        // 不明確
        console.log(typeof (!''));

        // js哪些布林值轉型一定為false?
        console.log(Boolean(''));
        console.log(Boolean(0));
        console.log(Boolean(-0));
        console.log(Boolean(NaN));
        console.log(Boolean(null));
        console.log(Boolean(undefined));
        console.log(Boolean(false));

        // ===========================================
        // 物件的強制轉型 (toString valueOf)
        // 1.物件轉布林值 任何非純值類型的數值 都會轉成true
        //2. 物件轉數值 字串



    </script>
</body>

</html>
