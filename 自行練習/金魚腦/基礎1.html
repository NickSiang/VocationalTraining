<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body bgcolor="yellow">
    <h1 align="center">This is heading</h1>
    <!-- 請僅把標題標籤用於標題文字。不要僅僅為了產生粗體文字而使用它們。
    請使用其它標籤或CSS 代替。 -->
    <hr/>
<!-- 水平線 -->
    <p>This is heading</p>
    <p>This is heading</p>
    <p>This is heading</p>
    <!-- （<p> 是块级元素） -->
    <!-- 使用空的段落標記<p></p> 去插入一個空白行是個壞習慣。
    用<br /> 標籤代替它！ （但不要用<br /> 標籤去建立清單 -->
    <p>This <br/> is heading <br/></p>
<!-- 
    您或許發現<br> 與<br /> 很相似。

在XHTML、XML 以及未來的HTML 版本中，不允許使用沒有結束標籤（閉合標籤）的HTML 元素。

即使<br> 在所有瀏覽器中的顯示都沒有問題，使用<br /> 也是更長遠的保障。
-->
<p>11111
        22222 
             33333
</p>
<!-- 注意，瀏覽器忽略了原始程式碼中的排版（省略了多餘的空格和換行）。 -->

    </table>
</body>
</html>
