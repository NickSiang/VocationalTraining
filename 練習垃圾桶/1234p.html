        .bannar {
            width: 100%;
            height: 100vh;
            background-color: aqua;
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            opacity: 0.8;

        .btn {
            width: 330px;
            height: 64px;
            color: white;
            text-align: center;
            font-size: 24px;
            letter-spacing: 10px;
            line-height: 64px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            /* 少逗號 */
            
        }

        .btn-1 {
            background: black;
        }

        .btn-4 {
            background-color: black;
            width: 164px;
        }



        .content {
            text-align: justify;
            /* 文字左右對齊 */
            padding: 80px;
         
            }

    </style>
