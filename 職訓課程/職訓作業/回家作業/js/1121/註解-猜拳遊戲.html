<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
    }

    .all {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
            radial-gradient(farthest-side at -33.33% 50%, #0000 52%, #8b91a3 54% 57%, #0000 59%) 0 calc(144px/2),
            radial-gradient(farthest-side at 50% 133.33%, #0000 52%, #8b91a3 54% 57%, #0000 59%) calc(144px/2) 0,
            radial-gradient(farthest-side at 133.33% 50%, #0000 52%, #8b91a3 54% 57%, #0000 59%),
            radial-gradient(farthest-side at 50% -33.33%, #0000 52%, #8b91a3 54% 57%, #0000 59%),
            #000000;
        background-size: calc(144px/4.667) 144px, 144px calc(144px/4.667);


    }

    .container {
        width: 80%;
        height: 80%;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        align-items: end;
    }

    .screen {
        width: 720px;
        height: 400px;
        background-color: rgba(242, 242, 242, 0.942);
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        font-weight: 600;
        padding: 20px;
    }


    .block {
        width: 50%;
        height: 20%;
        background: rgba(255, 255, 255, 0.449);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.275);
        display: flex;
        justify-content: space-around;
        align-items: center;
        border-radius: 20px;
    }


    .small-block {
        width: 100px;
        height: 100px;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        cursor: pointer;
        background-position: center;
        background-size: cover;
        cursor: pointer;
        opacity: 0.8;
    }

    .small-block:hover {
        box-shadow: 0px 0px 10px 2px rgb(198, 198, 198);
    }
</style>

<body>
    <div class="all">

        <div class="container">
            <div class="screen result"></div>
            <div class="block">

                <img src="./img/Frame 5.png" alt="" class="small-block paper">

                <img src="./img/Frame 6.png" alt="" class="small-block rock">

                <img src="./img/Frame 7.png" alt="" class="small-block scissors">
            </div>
        </div>
    </div>

    <script>
        const resultscreen = document.querySelector('.result');
        const block = document.querySelectorAll('.small-block');

        // forEach對每個元素執行的操作
        // forEach(option => { ... })：為 options 的每個選項加上點擊事件處理器。
        block.forEach(option => {
            option.addEventListener('click', function () {
                // this.classList[1]：取得被點擊的選項的第二個 class（rock、paper 或 scissors）
                const playerchoice = this.classList[1];
                const choices = ['rock', 'paper', 'scissors'];
                const computerchoice = choices[Math.floor(Math.random() * 3)];
                let result = "";


                if (playerchoice === computerchoice) {
                    result = '平手',document.querySelector('.screen').style.backgroundColor = 'lightgreen';;
                }
                else if ((playerchoice === 'rock' && computerchoice === 'scissors') ||
                    (playerchoice === 'paper' && computerchoice === 'rock') ||
                    (playerchoice === 'scissors' && computerchoice === 'paper')
                ) { result = '你贏了' ,document.querySelector('.screen').style.backgroundColor = 'orange';}

                else {
                    result = "你輸了",document.querySelector('.screen').style.backgroundColor = 'red';
                }


                resultscreen.innerHTML = `你出了 <b>${translate(playerchoice)}</b>，電腦出了 <b>${translate(computerchoice)}</b>，<br> <b>${result}</b>`;
                // ${ } 可以將變數或表達式插入到字串中
            })
        })


        // 翻譯選項為中文
        function translate(choice) {
            if (choice === 'rock') return '石頭';
            if (choice === 'paper') return '剪刀';
            if (choice === 'scissors') return '布';
        }
    </script>
</body>

</html>
