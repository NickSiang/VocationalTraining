<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float挑戰題</title>
</head>
<style>
    body {
        margin: 0;
    }

    .all {
        width: calc(100vh - 50px);
        height: calc(100vh - 50px);
        /* padding: 100px; */
        /* margin: auto; */


        /* position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%); */



    }

    .container {
        width: 100%;
        height: calc(100% / 3);
    }

    .block {
        width: 40%;
        height: 100%;
        float: left;
    }

    .red {
        background-color: red;
        float: left;
    }

    .purple {
        background-color: purple;
        float: right;
    }

    .green {
        background-color: aquamarine;
        margin: auto;
    }
</style>

<body>
    <div class="all">
        <div class="container">
            <div class="block red"></div>
            <div class="block purple"></div>
        </div>
        <div class="container">
            <div class="block green"></div>
        </div>

        <div class="container">
            <div class="block red"></div>
            <div class="block purple"></div>
        </div>
    </div>

</body>

</html>
<!-- padding應用 不用position-->
