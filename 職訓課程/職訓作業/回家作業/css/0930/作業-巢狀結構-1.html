<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.作業:巢狀結構</title>

    <style>
        #box-all {
            background-color: black;
            width: 600px;
            height: 600px;
        }

        #box-a {
            background-color: pink;
            width: 600px;
            height: 150px;
        }

        #box-b {
            background-color: black;
            width: 600px;
            height: 300px;
        }

        #box-b-left {
            background-color: lightblue;
            width: 300px;
            height: 300px;
            float: left;
        }

        #box-b-right {
            background-color: khaki;
            width: 300px;
            height: 300px;
            float: left;
        
        }

        #box-c {
            background-color: orange;
            width: 600px;
            height: 150px;
        }
    </style>
</head>

<body>
    <div id="box-all">
        <div id="box-a"></div>
        <div id="box-b">
            <div id="box-b-left"></div>
            <div id="box-b-right"></div>
        </div>
        <div id="box-c"></div>
    </div>

</body>

</html>
