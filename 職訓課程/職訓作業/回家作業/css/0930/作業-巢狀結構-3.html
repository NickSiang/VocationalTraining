<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3.作業:巢狀結構</title>

    <style>
        #box-all {
            background-color: black;
            width: 600px;
            height: 600px;
        }

        #box-a {
            background-color: pink;
            width: 600px;
            height: 150px;
        }

        #box-b {
            background-color: black;
            width: 600px;
            height: 300px;
        }

        #box-b-left {
            background-color: lightblue;
            width: 150px;
            height: 300px;
            float: left;
        }

        #box-b-right {
            background-color: khaki;
            width: 450px;
            height: 300px;
            float: left;
        }

        #box-b-right-top {
            background-color: yellow;
            width: 450px;
            height: 100px;
        }

        #box-b-right-top-a {
            background-color: green;
            width: 150px;
            height: 100px;
            float: left;
        }
        #box-b-right-top-b {
            background-color:greenyellow;
            width: 300px;
            height: 100px;
            float: left;
        }
        #box-b-right-middle {
            background-color: blue;
            width: 450px;
            height: 100px;
        }

        #box-b-right-middle-a {
            background-color:blueviolet;
            width: 300px;
            height: 100px;
            float: left;
        }
        #box-b-right-middle-b {
            background-color:burlywood;
            width: 150px;
            height: 100px;
            float:left;
        }
        #box-b-right-bottom {
            background-color: red;
            width: 450px;
            height: 100px;
        }
        #box-b-right-bottom-a {
            background-color:pink;
            width: 150px;
            height: 100px;
            float: left;
        }#box-b-right-bottom-b {
            background-color: red;
            width: 300px;
            height: 100px;
            float:left;
        }


        #box-c {
            background-color: orange;
            width: 600px;
            height: 150px;
        }
    </style>
</head>

<body>
    <div id="box-all">
        <div id="box-a"></div>
        <div id="box-b">
            <div id="box-b-left"></div>
            <div id="box-b-right">
                <div id="box-b-right-top">
                    <div id="box-b-right-top-a"></div>
                    <div id="box-b-right-top-b"></div>
                </div>
                <div id="box-b-right-middle">
                    <div id="box-b-right-middle-a"></div>
                    <div id="box-b-right-middle-b"></div>
                </div>
                <div id="box-b-right-bottom">
                    <div id="box-b-right-bottom-a"></div>
                    <div id="box-b-right-bottom-b"></div>
                    </div>
        
            </div>
        </div>
        <div id="box-c"></div>
    </div>

</body>

</html>
