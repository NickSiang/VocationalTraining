    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .all {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pokemon-ball {
            animation: ball 2s linear infinite;
            position: relative;
        }

        .pokemon-ball::before {
            content: "";
            position: absolute;
            top: 51.2%;
            left: 49.6%;
            border-radius: 50%;
            box-shadow: 0px 0px 100px 2px red;
            animation: color-change 3s linear infinite;
            z-index: 10;
        }

        @keyframes color-change {
            0% {
                box-shadow: 0px 0px 100px 20px red;
                transform: rotate(20deg);
            }

            50% {
                box-shadow: 0px 0px 70px 40px red;
                transform: rotate(-20deg);
            }

            100% {
                box-shadow: 0px 0px 100px 20px red;
                transform: rotate(20deg);
            }
        }

        @keyframes ball {
            0% {
                transform: rotate(20deg);
            }

            50% {
                transform: rotate(-20deg);
            }

            100% {
                transform: rotate(20deg);
            }
        }
    </style>
</head>
