<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrapper {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            box-shadow: 0 2px 50px rgb(114, 227, 252);
            background: #fff;
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
        }

        .title {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            z-index: 1;
            line-height: 300px;
            text-align: center;
            color: white;
            font-family: serif;
            font-size: 30px;
        }

        .wave {
            background:rgb(97, 27, 227);
            width: 500px;
            height: 500px;
            border-radius: 40%;
            opacity: 0.6;
            position: absolute;
            top: 70%;
            left: -30%;
            /* margin-left: -250px;
            margin-top: -250px; */
            transform-origin: center;
            animation: drift 7s infinite linear;
        }

        .wave.two {
            animation: drift 9s infinite linear;
        }


        .wave.three {
            animation: drift 11s infinite linear;
            opacity: 0.1;
        }

        .wave.four {
            animation: drift 15s infinite linear;
            opacity: 0.9;
        }

        .wave.six {
            animation: drift 30s infinite linear;
            opacity: 1;
        }

        .wave.five {
            animation: drift 18s infinite linear;
            opacity: 0.7;
        }

        .wave.six {
            animation: drift 11s infinite linear;
            opacity: 0.6;
        }


        @keyframes drift {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .wrapper:after {
            content: "";
            display: block;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                    rgb(19, 0, 97),
                    rgba(238, 221, 255, 0) 100%,
                    rgba(255, 255, 255, 0.5) 100%);
            z-index: 11;
            transform: translate3d(0, 0, 0);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="wave one"></div>
        <div class="wave two"></div>
        <div class="wave three"></div>
        <div class="wave four"></div>
        <div class="wave five"></div>
        <div class="wave six"></div>
        <div class="title">Wave Background</div>
    </div>


</body>

</html>
