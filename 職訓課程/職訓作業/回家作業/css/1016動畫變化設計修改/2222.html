<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            perspective: 500px;
        }

        .box {
            background-color: aqua;
            position: relative;
            width: 300px;
            height: 300px;
            margin: 100px auto;
            /* transition這個屬性可以從3個面向來調整動畫:

             時間長度(duration)
            調整個動畫的撥放時間長度。
             轉變速度(timing-function)
            動畫執行的速度，由快而慢，或是由慢而快等等的速度變化。
             延遲的時間(delay)
            觸發動畫後，等候多久再展現動畫。 */
            transition: all 2s;
            /* 讓子元素保持3d立體空間 */
            transform-style: preserve-3d;
        }

        .box:hover {
            transform: rotateY(360deg);
        }

        .box div.a {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 50%;
            background-color: pink;
            

        }

        .box div.b {
            width: 50%;
            height: 50%;
            background-color: purple;
            border-radius: 50%;
            transform: rotateX(60deg);
            top: 25%;
            left: 25%;

        }
    </style>
</head>

<body>
    <div class="box">
        <div class="a">1</div>
        <div class="b">2</div>
    </div>
</body>

</html>
