<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
        }

        .all {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
           
        }

        .box-1 {
            width: 100%;
            height: 100%;
           background-color: rgb(0, 0, 0);
            animation: color 10s ; 
        }
      

       
        @keyframes color {


            0% {
                width: 100vw;
                height: 100vh;
                background-color: white;
            
            } 

            100% {
                width: 100vw;
                height:100vh;
                background-color: rgb(0, 0, 0);
                
            }
        }
    </style>
</head>

<body>

    <div class="all">
        <div class="box box-1">
            <div class="box box-2"></div>
        </div>
    </div>

</body>

</html>
