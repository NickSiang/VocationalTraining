<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲骰子遊戲</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        section {
            height: 100vh;
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        .space {
            display: flex;
            gap: 20px;
            margin: 100px 0 20px;
        }

        .dice {
            width: 100px;
            height: 100px;
            border: 2px solid black;
            font-size: 60px;
            color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <section>
        <div class="space">
            <div class="dice d1">🎲</div>
            <div class="dice d2">🎲</div>
            <div class="dice d3">🎲</div>
        </div>

        <button type="button">擲骰子</button>

        <div class="result">結果</div>
        <div class="dice-result"></div>
    </section>

    <script>

        let btn = document.querySelector('button');
        let result = document.querySelector('.result');
        let diceResult = document.querySelector('.dice-result');
        let d1 = document.querySelector('.d1');
        let d2 = document.querySelector('.d2');
        let d3 = document.querySelector('.d3');

        btn.addEventListener('click', function () {

            let click = 20;

            diceResult.innerHTML = '';
            d1.innerHTML = '🎲';
            d2.innerHTML = '🎲';
            d3.innerHTML = '🎲';

            for (index = 0; index < click; index++) {

                let dice1 = Math.floor(Math.random() * 6) + 1;
                let dice2 = Math.floor(Math.random() * 6) + 1;
                let dice3 = Math.floor(Math.random() * 6) + 1;

                diceResult.innerHTML += `<br/>${dice1},${dice2},${dice3}`;

                if (dice1 == dice2 && dice2 == dice3) {
                    d1.innerHTML = `${dice1}`;
                    d2.innerHTML = `${dice2}`;
                    d3.innerHTML = `${dice3}`;
                    result.innerHTML = '遊戲結束';
                    click = 0;
                }

                else {
                    result.innerHTML = '再接再厲';
                }
            }
        });

    </script>
</body>

</html>

<!-- 需求 :
1.畫面上有一個按鈕可以骰骰子
2.按下按鈕會設20次 每一次骰殷子都會骰三顆
3.擴充 : 當每一次骰骰子的點數相同時就會停止 -->
