<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07-用before或after作修飾三角形</title>
    <style>
        * {
            box-sizing: border-box;
        }

        /* 記得before和after也要 */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .box {
            width: 300px;
            height: 300px;
            background-color: blueviolet;
            display: block;
            position: relative;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            border-top-left-radius: 30px;

        }

        .box::before {
            content: "";
            /* background: yellow; */
            position: absolute;
            width: 0;
            height: 0;
            top: 0;
            right: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid red;
            border-top: 60px solid red;
            border-bottom: 60px solid transparent;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="box"></div>
</body>

</html>
