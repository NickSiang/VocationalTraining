<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #all {background-color:white;
        width: 2000px;}

        #A {
            background-color: red;
            width: 500px;
            height: 500px;
            position: relative;
            float: left;

        }

        #a {
            background-color: black;
            width: 50px;
            height: 50px;
            position: absolute;
            right: calc(50% - 50px / 2);
            bottom: calc(50% - 50px / 2);
        }

        #B {
            background-color: blue;
            width: 500px;
            height: 500px;
            position: relative;
            float: left;

        }

        #b {
            background-color: black;
            width: 50px;
            height: 50px;
            position: absolute;
            right: calc(50% - 50px / 2);
            top: 0;
        }

        #C {
            background-color: green;
            width: 500px;
            height: 500px;
            position: relative;
            float: left;
        }

        #c {
            background-color: black;
            width: 50px;
            height: 50px;
            position: absolute;
            right: 50%;
            bottom: 0;
        }

        #D {
            background-color: yellow;
            width: 500px;
            height: 500px;
            position: relative;
            float: left;
        }

        #d {
            background-color: black;
            width: 50px;
            height: 50px;
            position: absolute;
            right: -25px;
            bottom: calc(50% - 50px / 2);
        }

        #E {
            background-color: orange;
            width: 500px;
            height: 500px;
            position: relative;
            float: left;
            clear: left;
        }

        #e {
            background-color: black;
            width: 50px;
            height: 50px;
            position: absolute;
            right: 0;
            bottom: 0;
        }

        #F {
            background-color: purple;
            width: 500px;
            height: 500px;
            position: relative;
            float: left;
        }

        #f {
            background-color: black;
            width: 50px;
            height: 50px;
            position: absolute;
            left: 0;
            bottom: calc(50% - 50px / 2);
        }

        #G {
            background-color: pink;
            width: 500px;
            height: 500px;
            position: relative;
            float: left;
        }

        #g {
            background-color: black;
            width: 50px;
            height: 50px;
            position: absolute;
            right: 0;
            bottom: calc(50% - 50px / 2);
        }
        #H {
            background-color:brown;
            width: 500px;
            height: 500px;
            position: relative;
            float: left;
        }

        #h {
            background-color: black;
            width: 50px;
            height: 50px;
            position: absolute;
            left: 0;
            bottom: -25px;
        }
    </style>


</head>

<body>
    <div id="all">
        <div id="A">
            <div id="a"></div>
        </div>
        <div id="B">
            <div id="b"></div>
        </div>
        <div id="C">
            <div id="c"></div>
        </div>
        <div id="D">
            <div id="d"></div>
        </div>
        <div id="E">
            <div id="e"></div>
        </div>
        <div id="F">
            <div id="f"></div>
        </div>
        <div id="G">
            <div id="g"></div>
        </div>
        <div id="H">
            <div id="h"></div>
        </div>
    </div>


</body>

</html>
