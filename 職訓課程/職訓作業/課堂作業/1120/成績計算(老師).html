<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    input {
      width: 100px;
      height: 30px;
    }

    button {
      width: 60px;
      height: 40px;
      font-size: 20px;
    }

    div {
      font-size: 20px;
    }
  </style>
</head>

<body>
  <p>
    國文: <input type="number" class="chinese" min="0" max="100">
  </p>
  <p>
    英文: <input type="number" class="english" min="0" max="100">
  </p>
  <p>
    數文: <input type="number" class="math" min="0" max="100">
  </p>
  <button type="button" class="reset"> 清空 </button>
  <button type="button" class="compute"> 計算 </button>
  <br><br>
  <div>平均: <span class="avg"></span></div>
  <div>結果: <span class="result"></span></div>
  <div>等級: <span class="grade"></span></div>

  <script>
    // 常數 const =>經常不變=>永遠不能改變的數
    let a1 = 10;
    a1 = 12;
    console.log(a1);

    // const a = 10;
    // a = 12; // 常數是不能改變
    // console.log(a);
    const chinese = document.querySelector('.chinese');
    const english = document.querySelector('.english');
    const math = document.querySelector('.math');
    const reset = document.querySelector('.reset');
    const compute = document.querySelector('.compute');
    const avg = document.querySelector('.avg');
    const result = document.querySelector('.result');
    const grade = document.querySelector('.grade');

    reset.addEventListener('click', function () {
      chinese.value = '';
      english.value = '';
      math.value = '';
      avg.textContent = '';
      grade.textContent = '';
      result.textContent = '';
    });

    compute.addEventListener('click', function () {
      if (!(chinese.value && english.value && math.value)) {
        alert('請接輸入分數');
      } else {
        let avgScore = (chinese.value * 1 + english.value * 1 + math.value * 1) / 3;
        let gradeText = '';

        if (avgScore >= 90) {
          gradeText = 'A'
        } else if (avgScore >= 80) {
          gradeText = 'B'
        } else if (avgScore >= 70) {
          gradeText = 'C'
        } else if (avgScore >= 60) {
          gradeText = 'D'
        } else {
          gradeText = '請再來一次！'
        }

        // if (1==1) console.log('aaaa');
        // else console.log('bbb');

        avg.textContent = avgScore.toFixed(1);
        grade.textContent = gradeText;

        if (avgScore < 60) {
          result.textContent = '不及格';
        } else {
          result.textContent = '及格';
        }
      }
    });
  </script>
</body>

</html>
<!-- 國文、英文、數學
1.能輸入分數
2.計算並顯示平均分數
3.判斷是否及格
4.還要給等級=>A(90分以上)、B(80分以上)、C(70分以上)、D(60分以上)、不及格(60分以下)=>死當 -->
