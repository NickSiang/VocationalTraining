<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.課堂練習:float基礎</title>
    <style>
        #box-a {
            background-color: brown;
            width: 50px;
            height: 50px;
            float: left;
            text-align: center;
            line-height: 50px;
        }

        #box-b {
            background-color: purple;
            width: 100px;
            height: 100px;
            float: right;
            text-align: center;
            line-height: 100px;
        }

        #box-c {
            background-color: green;
            width: 100px;
            height: 100px;
            float: left;
            clear: right;
            text-align: center;
            line-height: 100px;
        }
    </style>
</head>

<body>
    <div id="box-a">A</div>
    <div id="box-b">B</div>
    <div id="box-c">C</div>

</body>

</html>
