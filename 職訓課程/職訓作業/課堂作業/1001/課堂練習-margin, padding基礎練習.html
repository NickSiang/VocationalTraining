<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=++`-, initial-scale=1.0">
    <title>1.課堂練習-margin, padding基礎練習</title>
    <style>
        #box-all {
            background: black;
            width: calc(80% - 2*10px);
            height: calc(600px - 2*10px);
            margin: auto;
            /* 只有左右水平置中 */
            margin-top: 100px;
            padding: 10px;
        }

        #box-a {
            background: rgba(242, 180, 9, 0.938);
            width: 33%;
            height: 100%;
            float: left;
        }

        #box-b {
            background: rgb(20, 230, 12);
            width: calc(34% - 2*10px);
            height: 100%;
            float: left;
            margin-left: 10px;
        }

        #box-c {
            background: rgb(9, 178, 234);
            width: 33%;
            height: 100%;
            float: left;
            margin-left: 10px;
        }
    </style>



</head>

<body>
    <div id="box-all">
        <div id="box-a"></div>
        <div id="box-b"></div>
        <div id="box-c"></div>
    </div>

</body>

</html>
