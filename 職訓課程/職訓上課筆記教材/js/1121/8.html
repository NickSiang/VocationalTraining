<body>
    <script>
        let a = 1 + 2 + 3 + 4 + 5;
        console.log(a);


        
        for (let i = 0; i < 5; i++);
        /* let i = 0;: 初始值，i 的值從 0 開始。
     i < 5;: 迴圈的條件，當 i 小於 5 時，會繼續執行。
     i++: 每次迴圈結束後，i 的值增加1。*/

        let total = 0;

        for (let i = 1; i <= 100; i++) {
            total = total + i;
        }

        console.log(total);

        function sumAny(min, max) {
            let sum = 0;
            for (let i = min; 1 <= max; i++){
                 sum = sum + i;
            }
               return`結果:${sum}`;
        }

    </script>
