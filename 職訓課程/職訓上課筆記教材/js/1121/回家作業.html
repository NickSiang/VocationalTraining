<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
    }

    .all {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 80%;
        height: 80%;
        background-color: #f76767;
        display: flex;
        justify-content: center;
        align-items: end;
    }

    .block {
        width: 60%;
        height: 20%;
        background: #909090;
        display: flex;
        justify-content: space-around;
        align-items: center;
        border-radius: 20px;

    }

    .small-block {
        width: 100px;
        height: 100px;
        background-color: aliceblue;
        border-radius: 20px;

    }
</style>

<body>
    <div class="all">

        <div class="container">
            <div class="screen"></div>
            <div class="block">
                <div class="small-block rock"></div>
                <div class="small-block paper"></div>
                <div class="small-block scissors"></div>
            </div>
        </div>
    </div>

</body>

</html>
