<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房間管理系統</title>
    <style>
        label {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        section {
            margin-bottom: 20px;
        }

        .n1 {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .n2 {
            display: flex;
            gap: 50px;
            font-weight: bold;
        }

        .row {
            display: flex;
            gap: 50px;
        }

        input,
        select,
        button {
            padding: 5px;
        }

        select {
            width: 150px;
        }
    </style>
</head>

<body>
    <section>
        <label>
            <span>姓名:</span>
            <input type="text" id="list01">
        </label>
        <label>
            <span>性別:</span>
            <input type="text" id="list02">
        </label>
        <label>
            <span>手機:</span>
            <input type="text" id="list03">
        </label>
        <label>
            <span>信箱:</span>
            <input type="text" id="list04">
        </label>

        <select id="list05">
            <option value="" selected disabled>請選擇房號</option>
        </select>

        <button type="button">送出</button>
    </section>

    <section class="n1">
        <div class="n2">
            <div>房間編號</div>
            <div>姓名</div>
            <div>性別</div>
            <div>手機</div>
            <div>信箱</div>
        </div>
    </section>

    <script>
        let list05 = document.querySelector('#list05');
        let room = [];

        // 1.生成房號資料
        for (let i = 1; i <= 10; i++) {
            list05.innerHTML += `<option value="${i + 120}">${i + 120}房</option>`;
            room.push({ id: i + 120, name: '', gender: '', phone: '', email: '' });
        }

        // 2.監聽按鈕事件
        document.querySelector('button').addEventListener('click', function () {
            let list01 = document.querySelector('#list01');
            let list02 = document.querySelector('#list02');
            let list03 = document.querySelector('#list03');
            let list04 = document.querySelector('#list04');
            let list05 = document.querySelector('#list05');

            // 更新資料到陣列
            room.forEach((item) => {
                if (item.id == list05.value) {
                    item.name = list01.value;
                    item.gender = list02.value;
                    item.phone = list03.value;
                    item.email = list04.value;
                }
            });

            // 重新渲染畫面
            renderRoomData();
        });

        function renderRoomData() {
            let n1 = document.querySelector('.n1');
            n1.innerHTML = `
                <div class="n2">
                    <div>房間編號</div>
                    <div>姓名</div>
                    <div>性別</div>
                    <div>手機</div>
                    <div>信箱</div>
                </div>
            `;

            room.forEach((item) => {
                if (item.name || item.gender || item.phone || item.email) { // 顯示有資料的房號
                    n1.innerHTML += `
                        <div class="row">
                            <div>${item.id}</div>
                            <div>${item.name}</div>
                            <div>${item.gender}</div>
                            <div>${item.phone}</div>
                            <div>${item.email}</div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>

</html>
