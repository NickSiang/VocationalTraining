<body>
    <!-- 儲存、取出資料的語法 — 儲存setItem、取出getItem -->
    <!-- localStorage.setItem('myName',str); -->
    <!-- localStorage.getItem('myName'); -->

    <div>
        <input type="text" name="message board" id="" class="message-board">
        <button type="button" class="save">儲存</button>
        <button type="button" class="del">刪除</button>
        <div class="result">留言板</div>
    </div>

</body>

<script>

    let message = document.querySelector('.message-board');
    let save = document.querySelector('.save');
    let del = document.querySelector('.del')
    let result = document.querySelector('.result');
    let board = [];
    let local = (localStorage.getItem('bArray')).split(',');

    // if (localStorage.getItem('bArray') != null) {
    //     barray = (localStorage.getItem('bArray'));
    // }

    result.innerHTML += `<br/>${local}`


    save.addEventListener('click', function () {
        let messageValue = message.value;
        // console.log(messageValue);
        board.push(`${messageValue}`);
        console.log(board);

        localStorage.setItem('bArray',(board));
        result.innerHTML += `<br/> ${messageValue}`;

    })

    //parse()	//字串轉換物件
    //stringify()//物件轉換字串

</script>
