<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- 資料型態 -->
    <script>
        // var = variable 變數

        // 宣告變數
        var num1 = 10;
        document.write(num1);
        console.log(num1);

        var num2 = 20;
        console.log(num2)

        var text = '你好啊';
        console.log(text)

        /*var壞處 維護不易 可能重複宣告而覆蓋掉
        因此後來改用比較安全的方法let*/

        let a = '你好啊';
        // let無法重複宣告

        let b = true;
        console.log(b)
        // booleen布林值

        let c;
        console.log(c)
        // 無定義資料is not defined
        // = 是賦值

        let d = 123.123;
        console.log(d)
        // 小數稱為浮點數(float)

        let e = null;

        console.log(typeof (a));
        console.log(typeof (b));
        console.log(typeof (c));
        console.log(typeof (d));
        console.log(typeof (e));
        /* typeof可查詢變數型態
        string 字串
        boolean 布林值
        undefined 無定義資料
        number 數字
        object 物件*/
    </script>
</body>

</html>
