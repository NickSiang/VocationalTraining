<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //算術運算子 + .- .* . /. %(mod)取餘數
        let a = 10;
        let b = 20;
        let c = "8";
        let d = false;
        let e = '你好';
        let f = 3;
        console.log(a);
        console.log(a + b);
        console.log(a - b);

        // 數字與數字字串相減會變數字
        console.log(b - c);
        console.log(c - b);

        // 數字與數字字串相加會變字串
        console.log(c + b);
        console.log(b + c);

        // 數字與數字字串相加會變數值相乘
        console.log(c * b);
        console.log(b * c);

        // NaN not a number
        console.log(b % f);
        // %取得餘數

    </script>
</body>

</html>
