        console.log(testa());

        function testa() {

            console.log('我進到方法裡面了');

        }

        // break =>if for (直接終止後面要做的事)



        // continue =>for (掠過要做的事,執行下一個動作)

        for (let index = 0; index < 10; index++) {
            if(index == 5){
                continue;
            }

        }
