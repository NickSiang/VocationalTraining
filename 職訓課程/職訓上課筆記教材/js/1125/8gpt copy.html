        ]

        const btnAll = document.querySelectorAll('button');
        const cardRegion = document.querySelector('.card-region');
        let nowRegion = regionAll[0];

        const url = 'https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=CWA-98DE9976-8906-41AD-A1E7-2599F553F4A3';
        let orgData = [];


        fetchData();

        btnAll.forEach((btn, index) => {
            btn.addEventListener('click', () => {
                const filteredData = orgData.filter(cityData => nowRegion.includes(cityData.city));
                renderCards(filteredData);
c
            })
        });

        function fetchData() {
            fetch(url)
                .then((response) => response.json())
                .then((result) => {

                    organizeData(result.records.location);

                    renderCards(orgData);
                });
        }


        function organizeData(locations) {
            orgData = locations.map(location => {
                const wxElement = location.weatherElement[0].time[0];
                return {
                    city: location.locationName,
                    Wx: wxElement.parameter.parameterName,
                    WxImgIndex: wxElement.parameter.parameterValue,
                    startTime: wxElement.startTime,
                    maxT: location.weatherElement[4].time[0].parameter.parameterName
                };
            });
        }

        function arrangeDate() {
            nowRegion.forEach((city) => {
                console.log(city);
                let cityDate = orgData[city];
                showAllcard(city);
            }
            )
        }



        function renderCards(data) {
            cardRegion.innerHTML = '';
            data.forEach(city => {
                cardRegion.innerHTML += `
                    <div class='card'>
                        <img src=${city.WxImgIndex} alt='圖'>
                        <p>城市：${city.city}</p>
                        <p>天氣：${city.Wx}</p>
                        <p>開始時間：${city.startTime}</p>
                        <p>最高温度：${city.maxT}°C</p>
                    </div>
                `;
            });
        }
