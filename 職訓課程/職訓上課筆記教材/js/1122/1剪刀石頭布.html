<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let you = 1;
        let computer = 1;
        let result = you - computer;

        if (result == 0) {
            console.log("平手");
        } else if (result === -2 || result === 1) {
            console.log("你贏");
        } else {
            console.log("你輸");
        }


        switch (result) {
            case 0:
                console.log('平手')
                break;
            case -2:
            case 1:
                console.log('你贏')
            default:
                console.log('你輸')
                break;
        }
        /*switch (expression) {
            case value1:
                // 當 expression === value1 時執行此代碼
                break;
            case value2:
                // 當 expression === value2 時執行此代碼
                break;
            default:
                // 如果沒有 case 匹配，執行此代碼
                break;
        }*/


    </script>
</body>

</html>
<!-- 演算法     user  -  computer  
刀 1      1,2,3  =  0  , -1  , -2
石 2      1,2,3  =  1  ,  0  , -1
布 3      1,2,3  =  2  ,  1  ,  0

0 = 平手
-1, 2 = 輸
-2, 1= 贏 -->
