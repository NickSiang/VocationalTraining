<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let you = 1;
    let computer = 3;

    // 判斷輸贏
    let result = you - computer; 

    if (result === 0){
      console.log('平手');
    }else if (result === -2 || result === 1){
      console.log('你贏');
    }else {
      console.log('你輸');
    }


   // 判斷輸贏
    console.log(result);

    switch (result) {
      case 0:
        console.log('2平手');
        break; // 跳出
      case 1:
      case -2:
        console.log('2你贏');
        break;
      // case -1, 2:
        // console.log('你輸');
        // break;
      default:
        console.log('2你輸');
        break;
    }

  </script>
</body>
</html>
<!-- 演算法
      you   -   computer   結果       平手 你贏   你輸
刀      1         1      =  0          0   -2,1   -1,2
                  2      = -1(lost)
                  3      =  -2(win)

石      2         1     =  1(win)
                  2     =  0
                  3     =  -1(lost)
布      3         1     = 2(lost)
                  2     = 1(win)
                  3     =   0 -->
