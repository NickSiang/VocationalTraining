<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    .big-box {
      background-color: aqua;
      width: 500px;
      height: 500px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .box {
      background-color: red;
      width: 50%;
      height: 50%;
      border: 2px solid yellow;
    }

    .answer {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="big-box">
    <!-- <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box answer"></div> -->
  </div>
  <script>

    const bigBox = document.querySelector('.big-box');
    const answer = document.querySelector('.answer');

    let myTouch = 2;
    // 初始網格大小為 2x2

    bigBox.innerHTML = '';
    // 清空

    for (let i = 0; i < myTouch ** 2; i++) {
      bigBox.innerHTML += `<div class="box">${i}</div>`;
    }
    let boxAll = document.querySelectorAll('.box');
    let answerIndex = Math.floor(Math.random()*(myTouch**2));
    let answerBox = boxAll[answerIndex];

    answerBox.classList.add('answer');
    
    console.log(answerBox);
    //進入下一關 監聽新的答案盒被按
    repeatDo();

    //進入下一關 監聽新的答案盒被按
    function repeatDo() {
      answerBox.addEventListener('click', function () {
        myTouch++;
        console.log(myTouch);

        bigBox.innerHTML = '';
        for (let i = 0; i < myTouch ** 2; i++) {
          bigBox.innerHTML += `<div class="box">A</div>`;
        }
        boxAll = document.querySelectorAll('.box');
        answerBox = boxAll[3];
        console.log(boxAll);
        let color = getColor();
        for (let i = 0; i < myTouch ** 2; i++) {
          boxAll[i].style.backgroundColor = color;
          boxAll[i].style.width = `${100 / myTouch}%`;
          boxAll[i].style.height = `${100 / myTouch}%`;
        }
        // 自己呼叫自己
        repeatDo();
      });
    }
    
    function getColor() {
      let r = Math.floor(Math.random() * 255) + 1;
      let g = Math.floor(Math.random() * 255) + 1;
      let b = Math.floor(Math.random() * 255) + 1;
      return `rgb(${r},${g},${b})`;
    }
  </script>
</body>

</html>
