<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="demo"></div>
    <button type="button" class="pause">暫停</button>
    <button type="button" class="start">繼續</button>
    <script>

        const demo = document.querySelector('.demo');
        const pause = document.querySelector('.pause ');
        const start = document.querySelector('.start');

        getNewTime();

        let myInterval = setInterval(getNewTime, 1000);
        // 箭頭函式 把function 變成=>移至()後
        pause.addEventListener('click',() => {
            // 清除一個時段區間變數
            clearInterval(myInterval);
        });

        start.addEventListener('click',() => {
            // 清除一個時段區間變數
           myInterval = setInterval(getNewTime, 1000);
        });

        function getNewTime() {
            const date = new Date();
            demo.textContent = date.toLocaleString();

        }
    </script>
</body>


</html>
