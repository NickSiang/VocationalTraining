<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    .big-box {
      background-color: aqua;
      width: 500px;
      height: 500px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .box {
      background-color: red;
      width: 20%;
      height: 20%;
      border: 2px solid yellow;
    }

    .answer {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="big-box">
    <!-- <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box answer"></div> -->
  </div>
  <script>
    const bigBox = document.querySelector('.big-box');
    const answer = document.querySelector('.answer');

    let myTouch = 0
    // 清空

    bigBox.addEventListener('click', function () {
      myTouch++;
      bigBox.innerHTML = '';
      for (let i = 0; i < myTouch ** 2; i++) {
        bigBox.innerHTML += `<div class="box">A</div>`;
      }
      let boxAll = document.querySelectorAll('.box');
      console.log(boxAll);
      let color = getColor();
      for (let i = 0; i < myTouch ** 2; i++) {
        boxAll[i].style.backgroundColor = color;
      }
    });

    function getColor() {
      let r = Math.floor(Math.random() * 255) + 1;
      let g = Math.floor(Math.random() * 255) + 1;
      let b = Math.floor(Math.random() * 255) + 1;
      return `rgb(${r},${g},${b})`;
    }
  </script>
</body>

</html>
