<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @keyframes right {

      50%,
      100% {
        left: 100%;
      }
    }

    @keyframes bottom {

      100%,
      50% {
        top: 100%;
      }
    }

    @keyframes left {

      50%,
      100% {
        right: 100%;
      }
    }

    @keyframes top {

      100%,
      50% {
        bottom: 100%;
      }
    }

    @keyframes loading {
      100% {
        width: 135px;
      }
    }

    *,
    ::before,
    ::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .container {
      width: 100%;
      height: 100vh;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container .box {
      background-color: white;
      width: 300px;
      height: 300px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container .box .line-1 {
      background: linear-gradient(to right, transparent, orange);
      width: 100%;
      height: 10px;
      position: absolute;
      left: -100%;
      top: 0;
      animation: right 2s linear 0s infinite;
    }

    .container .box .line-2 {
      background: linear-gradient(to bottom, transparent, orange);
      width: 10px;
      height: 100%;
      position: absolute;
      right: 0;
      top: -100%;
      animation: bottom 2s linear 0.5s infinite;
    }

    .container .box .line-3 {
      background: linear-gradient(to left, transparent, orange);
      width: 100%;
      height: 10px;
      position: absolute;
      right: -100%;
      bottom: 0;
      animation: left 2s linear 1s infinite;
    }

    .container .box .line-4 {
      background: linear-gradient(to top, transparent, orange);
      width: 10px;
      height: 100%;
      position: absolute;
      left: 0;
      bottom: -100%;
      animation: top 2s linear 1.5s infinite;
    }

    .container .box h1 {
      border-right: 2px solid black;
      width: 0;
      overflow: hidden;
      animation: loading 2s linear 0s infinite;
    }

    .container .box:hover {
      box-shadow: 0 0 600px 150px white;
    }

    .container .box:hover .line-1 {
      background: linear-gradient(to right, transparent, black);
    }

    /*# sourceMappingURL=loading.css.map */
  </style>
</head>

<body>
  <div class="container">
    <div class="box">
      <div class="line line-1"></div>
      <div class="line line-2"></div>
      <div class="line line-3"></div>
      <div class="line line-4"></div>
      <h1>loading...</h1>
    </div>
  </div>
</body>

</html>
