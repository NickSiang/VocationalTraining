<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        ::after,
        ::before {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }

        .box:hover {
            box-shadow: 0 0 600px 150px white;
        }

        .container .box:hover .line-1 {
            background: linear-gradient(to right, transparent, black);
        }

        .container .box:hover .line-2 {
            background: linear-gradient(to bottom, transparent, black);
        }

        .container .box:hover .line-3 {
            background: linear-gradient(to left, transparent, black);
        }

        .container .box:hover .line-4 {
            background: linear-gradient(to top, transparent, black);
        }
        .container .box:hover  {
            background: linear-gradient(to top, transparent, white);
        }

        .box {
            width: 300px;
            height: 300px;
            background: linear-gradient(orange, yellow);
            opacity: 0.9;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .line-1 {
            width: 100%;
            height: 10px;
            background: linear-gradient(to right, transparent, yellow, orange);
            position: absolute;
            left: -100%;
            top: 0%;
            animation: line1 2s linear 0s infinite;

        }

        .line-2 {
            width: 10px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, yellow, orange);
            position: absolute;
            right: 0%;
            top: -100%;
            animation: line2 2s linear 0.5s infinite;

        }

        .line-3 {
            width: 100%;
            height: 10px;
            background: linear-gradient(to left, transparent, yellow, orange);
            position: absolute;
            right: -100%;
            bottom: 0%;
            animation: line3 2s linear 1s infinite;

        }

        .line-4 {
            width: 10px;
            height: 100%;
            background: linear-gradient(to top, transparent, yellow, orange);
            position: absolute;
            left: 0%;
            bottom: -100%;
            animation: line4 2s linear 1.5s infinite;
        }

        h1 {
            width: 0;
            border-right: 1px solid;
            animation: h1 2s infinite;
            overflow: hidden;
        }


        @keyframes h1 {
            100% {
                width: 150px;
                color: white;
            }

        }

        @keyframes line1 {

            50%,
            100% {
                left: 100%;
            }
        }

        @keyframes line2 {

            50%,
            100% {
                top: 100%;
            }
        }

        @keyframes line3 {

            50%,
            100% {
                right: 100%;
            }
        }

        @keyframes line4 {

            50%,
            100% {
                bottom: 100%;

            }
        }
    </style>
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            <div class="line line-1"></div>
            <div class="line line-2"></div>
            <div class="line line-3"></div>
            <div class="line line-4"></div>
            <h1>loading...</h1>
        </div>
    </div>

</body>

</html>
