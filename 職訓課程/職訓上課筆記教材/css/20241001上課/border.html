<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #box-a {
        background-color: black;
        width: 100px;
        height: 100px;
        border: 10px solid red;
        border: solid red 10px;
        border: 10px dashed black;

    }

    #box-b {
        background-color: rgb(228, 5, 5);
        width: 100px;
        height: 100px;
        /* border會有面積變大效應 */
        border-width: 10px;
        border-style: solid;
        border-color: yellow;
        /* border: none; */
        /* 取消border設定 */
        /* padding: 10px; */
    }

    #box-c {
        background-color: rgb(228, 5, 5);
        width: 100px;
        height: 100px;
   
        border-width: 10px;
        border-style: solid;
        border-color: yellow;
    }
</style>

<body>
    <div id="box-a"></div>
    <div id="box-b">b</div>
    <div id="box-c"></div>
</body>

</html>
