<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 快捷#all>#top+#middle+#bottom  */
    /* 快捷二#all>#top+(#middle>#middle-left+#middle-right)+#bottom */
    #all {
      background-color: aqua;
      width: 600px;
      height: 800px;
    }

    #box-top {
      background-color: black;
      width: 600px;
      height: 150px;
    }

    #box-middle {
      background-color: blue;
      width: 600px;
      height: 500px;
    }

    #box-middle-left {
      background-color: chartreuse;
      width: 450px;
      height: 500px;
      float: left;
    }

    #box-middle-right {
      background-color: purple;
      width: 150px;
      height: 500px;
      float: left;

    }

    #box-middle-right-top {
      background-color: red;
      width: 450px;
      height: 100px;
    }

    #box-middle-right-middle {
      background-color: blue;
      width: 450px;
      height: 100px;
    }

    #box-middle-right-bottom {
      background-color: yellow;
      width: 450px;
      height: 100px;
    }

    #box-bottom {
      background-color: orange;
      width: 600px;
      height: 150px;
      float: left;
    }
  </style>
</head>

<body>

  <div id="all">
    <div id="box-top"></div>

    <div id="box-middle">

      <div id="box-middle-left">

        <div id="box-middle-left-top">
          <div id="box-middle-left-top-left"></div>
          <div id="box-middle-left-top-right">
            <div id="box-middle-left-top-right-top"></div>
            <div id="box-middle-left-top-right-middle"></div>
            <div id="box-middle-left-top-right-bottom"></div>

          </div>


          <div id="box-middle-left-bottom">
            <div id="box-middle-left-bottom-top"></div>
            <div id="box-middle-left-bottom-bottom"></div>
          </div>

          <div id="box-middle-right"></div>
        </div>


        <div id="box-bottom"></div>

      </div>

</body>

</html>
