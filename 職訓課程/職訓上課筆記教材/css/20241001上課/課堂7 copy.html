<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #box-all {
        background-color: black;
        width:80%;
        height: 600px;
        margin: auto;
        padding: 10px;
        

    }

    #box-top {
        background-color: rgb(218, 67, 67);
        width: 100%;
        height: 20%;
        
    }

    #box-middle {
        background-color: rgb(205, 218, 67);
        width: 100%;
        height: calc(60%-10px*2);
        margin-top: 10px;
        
    }

    #box-bottom {
        background-color: rgb(13, 233, 13);
        width: 100%;
        height: 20%;
        margin-top: 10px;
        float: left;
    }
</style>

<body>

    <div id="box-all">
        <div id="box-top"></div>
        <div id="box-middle">
        <div id="box-middle-left"></div>
        <div id="box-middle-top"></div>
        <div id="box-middle-middle"></div>
        <div id="box-middle-bottom"></div>
        </div>
        <div id="box-bottom"></div>
    </div>
</body>

</html>
