<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    #box-all{
        background-color: black;
        width:calc(80% - 10px*2) ;
        height: calc(600px - 10px*2);
        margin:auto;
        margin-top: 100px;
        padding: 10px; ; 
       
    }
    #box-left{
        background-color: rgb(218, 67, 67);
        width: 33%;
        height: 100%;
        float: left;
    }
    #box-mid{
        background-color: rgb(205, 218, 67);
        width:calc(34% - 10px*2);
        height: 100%;
        margin-left: 10px; 
        float: left
        }
    #box-right{
        background-color: rgb(13, 233, 13);
        width: 33%;
        height: 100%;
        margin-left: 10px; 
        float: left;
    }
</style>
</head>
<body>

 <div id="box-all">
        <div id="box-left"></div>
        <div id="box-mid"></div>
        <div id="box-right"></div>
    </div>
</body>

</html>
