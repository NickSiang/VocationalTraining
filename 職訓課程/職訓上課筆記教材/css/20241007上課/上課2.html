<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            /* 初始化 歸零 */
        }
    #box-a{
        background-color:aqua;
        width: 100px;
        height: 100px;
        position: relative;
        left: 100px;
    }
    #box-b{
        background-color:rgb(255, 132, 0);
        width: 100px;
        height: 100px;
        position: relative;
        /* 相對定位 */
        left: 50px;
        /* 相對於原來位置左移 */
        top: 100px;
    }

</style>
</head>
<body>
    <div id="box-a"></div>
    <div id="box-b"></div>
    <div id="box-c"></div>
</body>
</html>
