<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
      height: 3000px;
    }

    #nav {
      background-color: aqua;
      width: 100%;
      height: 80px;
      position: fixed;
    }

    #all {
      background-color: black;
      width: 100%;
      height: 3000px;
      color: white;
      padding-top: 80px;
    }
    #banner {
      background-color: red;
      width: 60%;
      height: 400px;
      color: white;
      margin: auto;
      /* 背景圖片 */
      /* url 位址 */
      background-image: url(./img/bg-1.jpg);
      /* 設定圖片不重複 */
      background-repeat: no-repeat;
      /*  */
      background-size: cover;
      background-position: top;
      position: relative;
    }
    #avatar {
      background-color: red;
      width: 150px;
      height: 150px;
      background-image: url(./img/man-1.jpg);
      background-size: cover;
      border-radius: 50%;
      position: absolute;
      left: 100px;
      bottom: -120px;
      border: 5px solid black;
    }
    #left {
      background-color: bisque;
      width: 25%;
      height: 100%;
      float: left;
    }
    #middle {
      background-color: yellow;
      width: 50%;
      height: 100%;
      float: left;
    }
    #right {
      background-color: bisque;
      width: 25%;
      height: 100%;
      float: left;
    }
  </style>

</head>

<body>
  <div id="nav">
    <div id="left"> 
    </div>
    <div id="middle"></div>
    <div id="right"></div>
  </div>
  <div id="all">
    <div id="banner">
      <div id="avatar"></div>
    </div>
  </div>
</body>

</html>
