<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMALL PC</title>
    <style>
        * {
            box-sizing: border-box;
            /* 自動計算面積效應 */
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;

        }

        .nav {
            width: 366px;
            height: 100%;
            background-color: gray;
            float: left;
            padding: 75px 80px;
        }

        
        .nav-btn-all {
            /* background-color: white; */

            width: 200px;
            height: 300px;
            margin: 0 auto;
        }

        .nav-btn {
            background-color: blanchedalmond;
            width: 100%;
            height: 50px;
            float: left;
            margin-bottom: 10px;
            font-size: 32px;
            line-height: 50px;
            /* border:2px  inset lightsalmon; */
            /* border-top-style: groove; */
            border-radius: 10px;
        }

        .logo {
            background-image: url();
            height: 150px;
            width: 150px;
            border-radius: 50%;
            background-size: cover;
            margin: 0 auto 30px;

        }

        .container {
            background-color: lightgray;
            width: calc(100% - 366px);
            height: 100%;
            /* height: calc(100% - (100vh - 570px) / 2); */
            float: left;
            padding-top: calc((100vh - 570px) / 2);
        }

        .content {
            /* background: lightpink; */
            width: 800px;
            height: 570px;
            margin: auto;

        }

        .img {
            background-color: blue;
            background: center;
            width: calc((100% - 20px) / 3);
            height: calc(50% - 5px);
            float: left;
            border-radius: 10px;


        }

        .img-1 {
            width: 100%;
            background-image: url();
            margin-bottom: 10px;
        }

        .img-2 {
            width: calc(50% - 5px);
            background-image: url();
            margin-right: 10px;
        }

        .img-3 {
            width: calc(50% - 5px);
            background-image: url();
        }

        .img:hover {
            /* transform: scale(1.05); */
            /* transform: scale(0.9); */
            opacity: 0.6;
            transform: rotateY(180deg) scale(0.8);
            transition: 2s;
            border-radius: 10px;
        }
    </style>


</head>

<body>
    <div class="nav">

        <input type="checkbox" id="ham-menu-switch" hidden>

        <label for="ham-menu-switch" class="htm-btn">

            <div class="line line-1"></div>
            <div class="line line-2"></div>
            <div class="line line-3"></div>

        </label>
        <!-- 漢堡條在此 之後要加 -->
        <div class="logo"></div>
        <div class="nav-btn-all">
            <a class="nav-btn nav-btn-1">1</a>
            <a class="nav-btn nav-btn-2">2</a>
            <a class="nav-btn nav-btn-3">3</a>
        </div>
    </div>
    <div class="container">
        <div class="content">
            <!-- 包進圖片的容器 -->
            <div class="img img-1"></div>
            <div class="img img-2"></div>
            <div class="img img-3"></div>
        </div>
    </div>


    </div>

</body>

</html>
