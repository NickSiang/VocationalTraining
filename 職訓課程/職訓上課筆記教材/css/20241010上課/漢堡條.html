<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .htm-btn {
            background-color: rgb(41, 255, 41);
            width: 100px;
            height: 100px;
            display: block;
            position: relative;
        }

        .htm-btn .line {
            /* 空格代表ham-btn的後代line */
            background-color: rgb(37, 139, 16);
            width: 80%;
            height: 10px;
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            transition: 1s;
        }

        .htm-btn .line-1 {

            top: 25%
            
        }

        .htm-btn .line-2 {
            top: 50%
        }

        .htm-btn .line-3 {
            top: 75%
        }

        #ham-menu-switch:checked+.htm-btn .line-1 {
            background-color: yellow;
            top: 50%;
            transform: translate(-50%, -50%)  rotate(45deg);}
       
        #ham-menu-switch:checked+.htm-btn .line-2 {
            background-color: yellow; 
            display: none;
        }
        #ham-menu-switch:checked+.htm-btn .line-3 {
            background-color: yellow;
            top: 50%;
            transform: translate(-50%, -50%)  rotate(-45deg);}

    </style>
</head>

<body>
    <input type="checkbox" id="ham-menu-switch" hidden>

    <label for="ham-menu-switch" class="htm-btn">

        <div class="line line-1"></div>
        <div class="line line-2"></div>
        <div class="line line-3"></div>

    </label>
</body>


</html>
