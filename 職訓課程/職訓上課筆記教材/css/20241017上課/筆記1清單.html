<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style-type: none;
            /* 無法控制下方的表情符號 */
            cursor: pointer;
        }
        ul li::marker{
            content: "😊";
            font-size:10px;
        }
        /* li::marker{
            content: "💖";
            font-size:10px;
        } */
        /* 可直接插入清單  可放入表情符號 字元性質*/

        /* list-style-type：修改列表開頭符號 */
        /* list-style-image：修改列表開頭小圖示 無法變更大小位置*/
        /* list-style-position：修改列表的顯示位置 */

        /* list-style-type:disc;變有序清單 */
    </style>

</head>

<body>
    <ul>
        <!-- 沒有順序的清單 -->
        <li>清單🐱‍🐉</li>
        <li>清單</li>
        <li>清單</li>
        <li>清單</li>
        <li>清單</li>
        <!-- HTML元素用來表示清單中的項目。 -->
    </ul>
    <ol>
        <!-- 有序清單 -->
        <li>步驟1</li>
        <li>步驟2</li>
        <li>步驟3</li>
        <li>步驟4</li>
    </ol>
</body>

</html>
