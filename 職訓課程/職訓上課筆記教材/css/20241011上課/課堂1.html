<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            /* 把body宣告彈性容器 在裡面置中 都會 */
            flex-direction: row;

            /* flex-wrap: wrap; */
            /* 內容常會被壓縮且擠在同一行，
            這時可以透過 flex-wrap 來換行。 */


            margin:auto;
            justify-content: center;
            /* 水平置中 */
            align-items: center;
            /* 垂直置中 */
            justify-self: flex-start;
        }

        .box {
            background-color: red;
            width: 100px;
            height: 100px;
            border: 3px solid rgb(27, 22, 22);
            display: flex;
            justify-content: center;
            align-items: center;
            /* 文字在容器置中 通常在不確定 h w時 */
           
            /* text-align: center;
            line-height: 50px; */
            /* 文字置中 */

        }

        .box-1 {
            float: left;
        }
    </style>
</head>

<body>
    <div class="box box-1">1</div>
    <div class="box box-2">2</div>
    <div class="box box-3">3</div>
    <div class="box box-4">4</div>
    <div class="box box-5">5</div>
    <div class="box box-6">6</div>
    <div class="box box-7">7</div>
    <div class="box box-8">8</div>
    <div class="box box-9">9</div>
    <div class="box box-10">10</div>
    <div class="box box-11">11</div>
    <div class="box box-12">12</div>
    <!-- $=>用數字@=>從多少開始{}=>標籤內 -->


</body>

</html>
