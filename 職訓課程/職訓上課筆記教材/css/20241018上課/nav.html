<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a {
            text-decoration: none;
            display: block;
            width: 100%;
            height: 100%;
            /* 宣布block就可以整個把整個區塊變超連結 */
            border: 1px dashed transparent;
            /* 要先加邊框避免爆版focus */
        }

        a:focus {
            /* background-color: brown; */
            border: 1px dashed black;

        }

        ul a:focus span {

            border-bottom: 2px solid black;

        }

        /* 焦點(被關注 )*/
        /* li:focus{background-color: brown;} */
        /* 此寫法也可以 */
        ul {
            background-color: aquamarine;
            width: 500px;
            height: 100px;
            display: flex;
            justify-content: start;
            align-items: start;
            list-style: none;
            padding: 0;
            /* cursor: pointer; */
            font-size: 32px;

        }

        /* 
        ul li {
            background-color: red;
            width: auto;
            height: 100%;

        } */
        ul li a {
            background-color: gainsboro;
            width: auto;
            height: 100%;
            padding: 10px 15px;
            /* border-bottom: 2px solid black ; */
        }

        /* 只有ul li 的a才有作用 */


        ul li:hover span {
            border-bottom: 2px solid black;
        }


        /* 當ul li被hover後 span要出現 */
    </style>
</head>

<body>
    <ul>

        <li><a href="https://www.microsoft.com/zh-tw/"><span>1111111</span></a></li>
        <li><a href=""></span>2222222</span></a></li>
        <!-- tabindex="1"可用來模擬-->
        <li><a href=""></span>3333333</span></a></li>
        <!-- <div><a href=""></a></div> -->
        <!-- 此上方html比較正統 -->
    </ul>
</body>

</html>
