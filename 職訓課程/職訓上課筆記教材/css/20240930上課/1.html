<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <!-- 行動裝置才有效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #隨意 {

            background-color: aqua;
            /* 背景顏色 */
            color: blue;
            /* 字體顏色 */
            width: 80px;
            height: 50px;
            /* px像素 */
        }

        #隨便 {
            background-color: burlywood;
            color: rgb(68, 100, 100);
            width: 30px;
            height: 20px;

        }

        #隨機 {
            background-color: darkorange;
            color: lightblue;
            width: 50px;
            height: 50px;
            height: 80px;
        }

        #box-1 {
            background-color: rgb(248, 5, 5);
            color: ;
            width: 50px;
            height: 50px;
            float: left;
        }

        #box-2 {
            background-color: rgb(253, 164, 76);
            color: ;
            width: 50px;
            height: 50px;
            float: right;
            clear: ;
            /* clear為清除前一列的(狀態)邊漂浮狀態 */
        }

        #box-3 {
            background-color: rgb(95, 133, 30);
            color: ;
            width: 100px;
            height: 50px;
            float: left;
        }
    </style>

</head>


<!-- css後面敘述會蓋過前面 -->
<!-- /# 告訴css要去id找 記得分行 */ 
    /* <! 快速打顏色例如w500 -->
<!-- 不漂獨佔一列 只要有漂浮可並列 -->
 <!-- clear寫在float的下面 -->



<body>

    <div id="隨意">1111</div>
    <div id="隨便">7222</div>
    <div id="隨機">6333</div>


    <div id="box-1">a</div>
    <div id="box-2">b</div>
    <div id="box-3">c</div>

</body>
<!-- 起始標籤(tag)     標籤內容     結束標籤 -->
<!-- div 區塊 =功能在於建立房間 分割區塊
     特性:占滿一整列 區塊層級(block level) -->
<!-- id 是唯一的識別 一個id只會給一個標籤使用 
     也只能給一個標籤使用 命名規格 用英文開頭(最好小寫) 
     不用特殊符號 只能用-(一般常用)和_ 盡量語意化 -->
<!-- css不會去檢查錯誤 因此不要直接複製id直接用 
     在直接新增新的id -->
<!-- # box -* 3 編輯快速方法(生成三個) -->

</html>
