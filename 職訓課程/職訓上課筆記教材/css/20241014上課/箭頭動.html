<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        ::before,
        ::after {
            box-sizing: border-box;
        }

        .box {
            width: 50px;
            height: 30px;
            background-color: aqua;
            position: relative;
        }

        .box:hover::after {
            /* background-color: brown; */
            right:-100px;

        }

        .box::after {
            content: ">";
            /* background-color: blue; */
            width: 50px;
            height: 30px;
            position: absolute;
            right: -80px;
            top: 0;

        }
    </style>
</head>

<body>
    <div class="box">請點我</div>

</body>

</html>
