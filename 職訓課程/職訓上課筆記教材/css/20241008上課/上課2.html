<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            /* height:calc(50vh + 250px); */
            height: calc(100vh - (50vh - 250px));
            /* vw看到這個視窗的寬高度 */
            /* padding-top: calc(50vh - 250px); */
            padding-top: calc(50vh - 250px);
           
        }

        #box-a {
            background: black;
            /* width: 500px;
            height: calc(500px - ((500px - 100px) / 2)); */
            width: 500px;
            height: 300px;
            /* padding-top: calc((500px - 100px) / 2); */
            padding-top: 200px;
            margin: auto;
        }

        #box-b {
            background: bisque;
            width: 100px;
            height: 100px;
            margin: auto;
        }
    </style>
</head>

<body>
    <div id="box-a">
        <div id="box-b"></div>
    </div>
</body>

</html>
